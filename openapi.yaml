openapi: 3.0.0
info:
  title: Healthcare Appointment & Follow-up Manager API
  version: 1.0.0
  description: Backend API for patient/doctor/admin portals
servers:
  - url: http://localhost:5000/api

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Doctor:
      type: object
      properties:
        id: { type: string }
        specialisation: { type: string }
        slotDurationMin: { type: integer }
        user:
          type: object
          properties:
            name: { type: string }
    Appointment:
      type: object
      properties:
        id: { type: string }
        slotStart: { type: string, format: date-time }
        slotEnd: { type: string, format: date-time }
        status: { type: string, enum: [BOOKED, COMPLETED, CANCELLED, NO_SHOW] }
        symptoms: { type: string }
        urgencyLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }
        preVisitSummary: { type: object }
        postVisitSummary: { type: object }

paths:
  /auth/register:
    post:
      summary: Patient self-registration
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
                phone: { type: string }
      responses:
        "201":
          description: "Registered, returns token and user object"

  /auth/login:
    post:
      summary: Login for any role (patient/doctor/admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: "Logged in, returns token and user object"

  /auth/me:
    get:
      summary: Get current logged-in user
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current user }

  /auth/google/connect:
    get:
      summary: Get Google OAuth consent URL to link Calendar
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: "Returns a url field to redirect the user to"

  /admin/doctors:
    post:
      summary: Create a doctor account (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, specialisation, workingHours]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
                specialisation: { type: string }
                slotDurationMin: { type: integer, default: 30 }
                workingHours:
                  type: object
                  description: 'e.g. { "mon": ["09:00","17:00"], "sun": null }'
      responses:
        "201": { description: Doctor created }
    get:
      summary: List all doctors (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of doctors
          content:
            application/json:
              schema:
                type: object
                properties:
                  doctors:
                    type: array
                    items: { $ref: "#/components/schemas/Doctor" }

  /admin/doctors/{doctorId}:
    patch:
      summary: Update a doctor's profile (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: doctorId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Updated doctor profile }

  /admin/doctors/{doctorId}/leave:
    post:
      summary: Mark a doctor on leave for a date - cascades cancellations + notifications
      security: [{ bearerAuth: [] }]
      parameters:
        - name: doctorId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                reason: { type: string }
      responses:
        "201": { description: Leave added, returns affectedCount }

  /patient/doctors:
    get:
      summary: Search doctors by specialisation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: specialisation
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Matching doctors
          content:
            application/json:
              schema:
                type: object
                properties:
                  doctors:
                    type: array
                    items: { $ref: "#/components/schemas/Doctor" }

  /patient/doctors/{doctorId}/slots:
    get:
      summary: Get available slots for a doctor on a given date
      security: [{ bearerAuth: [] }]
      parameters:
        - name: doctorId
          in: path
          required: true
          schema: { type: string }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: "Returns a slots array of slotStart/slotEnd pairs, plus onLeave flag"

  /patient/appointments:
    post:
      summary: Book an appointment (triggers pre-visit LLM summary + email + calendar)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [doctorId, slotStart, symptoms]
              properties:
                doctorId: { type: string }
                slotStart: { type: string, format: date-time }
                symptoms: { type: string }
      responses:
        "201": { description: Appointment booked }
        "409": { description: Slot was just taken by someone else (race condition) }
    get:
      summary: Get logged-in patient's appointments
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointments:
                    type: array
                    items: { $ref: "#/components/schemas/Appointment" }

  /patient/appointments/{appointmentId}/cancel:
    post:
      summary: Cancel an appointment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Cancelled }

  /doctor/appointments:
    get:
      summary: Doctor's own appointments, urgency-sorted
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointments:
                    type: array
                    items: { $ref: "#/components/schemas/Appointment" }

  /doctor/appointments/{appointmentId}/complete:
    post:
      summary: Submit post-visit notes + prescription, triggers patient-friendly LLM summary
      security: [{ bearerAuth: [] }]
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [clinicalNotes]
              properties:
                clinicalNotes: { type: string }
                prescription:
                  type: array
                  items:
                    type: object
                    properties:
                      medicine: { type: string }
                      dosage: { type: string }
                      frequency: { type: string }
                      durationDays: { type: integer }
      responses:
        "200": { description: Appointment marked completed with summary }

  /doctor/appointments/{appointmentId}/no-show:
    post:
      summary: Mark a patient as no-show
      security: [{ bearerAuth: [] }]
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Marked no-show }
